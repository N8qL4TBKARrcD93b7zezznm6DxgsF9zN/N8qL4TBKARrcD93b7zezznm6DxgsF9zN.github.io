<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Token</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f3f4f6; color: #111; margin: 0; padding: 24px 16px; }
  .card { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 16px; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; font-family: monospace; font-size: 13px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; resize: vertical; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: #1877f2; color: #fff; font-size: 15px; cursor: pointer; }
  .muted { color: #6b7280; font-size: 14px; margin-top: 12px; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
<div class="card" id="app">
  <h1>ok</h1>
</div>
<script>
  // Всё работает только в браузере: страница ничего никуда не отправляет.
  var app = document.getElementById('app');
  var hash = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  var token = hash.get('access_token');
  var err = query.get('error_description') || hash.get('error_description') || query.get('error') || hash.get('error');

  if (token) {
    var expires = parseInt(hash.get('expires_in') || '0', 10);
    var hours = expires ? Math.round(expires / 3600) : null;
    app.innerHTML =
      '<h1>Токен получен</h1>' +
      '<textarea id="t" readonly></textarea>' +
      '<button id="c">Скопировать</button>' +
      '<div class="muted">' + (hours ? 'Срок жизни: ~' + hours + ' ч. ' : '') +
      'Это короткий токен — дальше его меняют на 60-дневный.</div>';
    document.getElementById('t').value = token;
    document.getElementById('c').onclick = function () {
      var t = document.getElementById('t');
      t.select();
      try { navigator.clipboard.writeText(token); } catch (e) { document.execCommand('copy'); }
      this.textContent = 'Скопировано';
    };
    // Убираем токен из адресной строки и истории браузера.
    history.replaceState(null, '', location.pathname);
  } else if (err) {
    app.innerHTML = '<h1 class="error">Ошибка входа</h1><div id="e"></div>';
    document.getElementById('e').textContent = err.replace(/\+/g, ' ');
  }
</script>
</body>
</html>
